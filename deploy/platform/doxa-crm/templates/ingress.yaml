apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: doxa-crm
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.host | quote }}
    external-dns.alpha.kubernetes.io/target: {{ .Values.origin | quote }}
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service: {name: doxa-crm-api, port: {number: 80}}
          - path: /health
            pathType: Exact
            backend:
              service: {name: doxa-crm-api, port: {number: 80}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: doxa-crm-frontend, port: {number: 80}}
