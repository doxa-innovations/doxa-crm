apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: doxa-crm-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  infisicalAuthRef:
    name: doxa-infisical-runtime
    namespace: infisical-operator-system
  syncOptions: {refreshInterval: 60s, instantUpdates: false}
  sources:
    - projectSlug: {{ .Values.infisical.projectSlug | quote }}
      environmentSlug: {{ .Values.infisical.environment | quote }}
      secretPath: {{ .Values.infisical.path | quote }}
      recursive: false
  targets:
    - name: {{ .Values.secretName }}
      namespace: {{ .Release.Namespace }}
      kind: Secret
      creationPolicy: Orphan
