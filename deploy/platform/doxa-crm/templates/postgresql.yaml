apiVersion: v1
kind: Service
metadata:
  name: doxa-crm-postgresql
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
spec:
  selector: {app.kubernetes.io/name: doxa-crm-postgresql}
  ports: [{name: tcp, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: doxa-crm-postgresql
  annotations: {argocd.argoproj.io/sync-wave: "-20"}
spec:
  serviceName: doxa-crm-postgresql
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: doxa-crm-postgresql}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: doxa-crm-postgresql
        app.kubernetes.io/part-of: doxa-crm
      annotations:
        backup.velero.io/backup-volumes: data
    spec:
      nodeSelector: {platform.doxa.io/site: {{ .Values.site | quote }}}
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgresql
          image: {{ .Values.postgresImage | quote }}
          securityContext:
            {{- include "crm.security" . | nindent 12 }}
            runAsUser: 70
            runAsGroup: 70
          ports: [{containerPort: 5432}]
          env:
            - {name: PGDATA, value: /var/lib/postgresql/pgdata}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: {name: {{ .Values.secretName }}, key: POSTGRES_DB}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: {{ .Values.secretName }}, key: POSTGRES_USER}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.secretName }}, key: POSTGRES_PASSWORD}
          readinessProbe:
            exec: {command: [sh, -ec, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1']}
            periodSeconds: 5
          resources:
            requests: {cpu: 25m, memory: 128Mi}
            limits: {memory: 768Mi}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storageClass }}
        resources:
          requests: {storage: 5Gi}
